name: Issue254 stage history validation
on:
  push:
    branches: [codex/issue254-stage-green-20261115]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inputs:
    uses: ./.github/workflows/_node-inputs.yml
    with:
      rebuild_runtime: true
      artifact: issue254-green-inputs
  tests:
    needs: inputs
    uses: ./.github/workflows/_node-unit-tests.yml
    with:
      mode: source-only
      handoff: ${{ needs.inputs.outputs.artifact }}
      tests: com.deepseekharness.app.util.BackupTaskStateTest com.deepseekharness.app.util.DeployStagesTest com.deepseekharness.app.util.MaintenanceFooterPolicyTest com.deepseekharness.app.util.DeployDisplayTest com.deepseekharness.app.ui.Deploy*Test
      rerun: true
      artifact: issue254-green-unit-results
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Format only the seven changed files with the fixed tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          git rev-parse HEAD > out/issue254-source.txt
          python3 tools/format-java.py --write --files app/src/main/java/com/deepseekharness/app/util/BackupTaskState.java app/src/main/java/com/deepseekharness/app/util/DeployStages.java app/src/main/java/com/deepseekharness/app/util/MaintenanceFooterPolicy.java app/src/main/java/com/deepseekharness/app/ui/ExtractFooter.java app/src/test/java/com/deepseekharness/app/util/BackupTaskStateTest.java app/src/test/java/com/deepseekharness/app/util/DeployStagesTest.java app/src/test/java/com/deepseekharness/app/util/MaintenanceFooterPolicyTest.java --report app/build/java-format/issue254-write.json
          git diff --check
          python3 tools/check-source-hygiene.py
          python3 tools/format-java-tree.py --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue254-formatted-source
          path: |
            app/src/main/java/com/deepseekharness/app/util/BackupTaskState.java
            app/src/main/java/com/deepseekharness/app/util/DeployStages.java
            app/src/main/java/com/deepseekharness/app/util/MaintenanceFooterPolicy.java
            app/src/main/java/com/deepseekharness/app/ui/ExtractFooter.java
            app/src/test/java/com/deepseekharness/app/util/BackupTaskStateTest.java
            app/src/test/java/com/deepseekharness/app/util/DeployStagesTest.java
            app/src/test/java/com/deepseekharness/app/util/MaintenanceFooterPolicyTest.java
            app/build/java-format/issue254-write.json
            app/build/java-format/tree-summary.json
            out/issue254-source.txt
