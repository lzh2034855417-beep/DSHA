name: Issue254 stage regression RED
on:
  push:
    branches: [codex/issue254-stage-red-20261115]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inputs:
    uses: ./.github/workflows/_node-inputs.yml
    with:
      rebuild_runtime: true
      artifact: issue254-red-inputs
  tests:
    needs: inputs
    uses: ./.github/workflows/_node-unit-tests.yml
    with:
      mode: source-only
      handoff: ${{ needs.inputs.outputs.artifact }}
      tests: com.deepseekharness.app.util.BackupTaskStateTest com.deepseekharness.app.util.DeployStagesTest
      rerun: true
      artifact: issue254-red-unit-results
