name: PR235 targeted Android JVM validation
on:
  push:
    branches: [codex/pr235-regression-proof-20261115]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inputs:
    uses: ./.github/workflows/_node-inputs.yml
    with:
      rebuild_runtime: true
      artifact: pr235-inputs
  tests:
    needs: inputs
    uses: ./.github/workflows/_node-unit-tests.yml
    with:
      mode: source-only
      handoff: ${{ needs.inputs.outputs.artifact }}
      tests: com.deepseekharness.app.ui.BrowserTasksTest com.deepseekharness.app.ui.PictureInPictureOptInTest
      rerun: true
      artifact: pr235-unit-results
