name: PR215 adopted grep policy validation
on:
  push:
    branches: [codex/pr215-policy-validation-20261115]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inputs:
    uses: ./.github/workflows/_node-inputs.yml
    with:
      rebuild_runtime: true
      artifact: pr215-inputs
  tests:
    needs: inputs
    uses: ./.github/workflows/_node-unit-tests.yml
    with:
      mode: source-only
      handoff: ${{ needs.inputs.outputs.artifact }}
      tests: com.deepseekharness.app.util.DeviceShell*Test
      rerun: true
      artifact: pr215-unit-results
  python-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run actual Python executor policy regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pr215-policy
          git rev-parse HEAD > out/pr215-policy/source.txt
          sha256sum app/src/main/assets/device-shell-policy.py tools/test-device-shell-policy.py app/src/main/java/com/deepseekharness/app/util/GrepReadPaths.java > out/pr215-policy/inputs.sha256
          python3 -B tools/test-device-shell-policy.py 2>&1 | tee out/pr215-policy/python.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pr215-python-policy
          path: out/pr215-policy
