name: PR235 fixed formatter and byte evidence
on:
  push:
    branches: [codex/pr235-format-repair-20261115]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Format only the added-regression test with the fixed tool
        run: |
          mkdir -p out
          git rev-parse HEAD > out/pr235-format-source.txt
          python3 tools/format-java.py --write --files app/src/test/java/com/deepseekharness/app/ui/BrowserTasksTest.java --report out/pr235-format-write.json
          git diff --stat
          git diff --check
      - name: Recheck the complete official formatting gate
        run: python3 tools/format-java-tree.py --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pr235-formatted-source
          path: |
            app/src/test/java/com/deepseekharness/app/ui/BrowserTasksTest.java
            out/pr235-format-*
            app/build/java-format/tree-summary.json
